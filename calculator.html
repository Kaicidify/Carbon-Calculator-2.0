<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Carbon Footprint Calculator - Form</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif:wght@400;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container-fluid page-wrapper">

    <!-- Heading -->
    <div class="row">
      <div class="col-12 text-center mb-3">
        <h1>Carbon Footprint Calculator</h1>
      </div>
    </div>

    <!-- Tabs -->
    <div class="row">
      <div class="col-12">
        <div class="tab-bar d-flex align-items-center justify-content-between">
          <ul class="nav nav-tabs flex-grow-1 me-3" id="calcTabs" role="tablist">
            <li class="nav-item" role="presentation">
              <button class="nav-link active" data-bs-toggle="tab" data-bs-target="#general" type="button" role="tab">General</button>
            </li>
            <li class="nav-item" role="presentation">
              <button class="nav-link" data-bs-toggle="tab" data-bs-target="#home" type="button" role="tab">Home</button>
            </li>
            <li class="nav-item" role="presentation">
              <button class="nav-link" data-bs-toggle="tab" data-bs-target="#travel" type="button" role="tab">Travel</button>
            </li>
            <li class="nav-item" role="presentation">
              <button class="nav-link" data-bs-toggle="tab" data-bs-target="#food" type="button" role="tab">Food</button>
            </li>
            <li class="nav-item" role="presentation">
              <button class="nav-link" data-bs-toggle="tab" data-bs-target="#electronic" type="button" role="tab">Electronic usage</button>
            </li>
            <li class="nav-item" role="presentation">
              <button class="nav-link" data-bs-toggle="tab" data-bs-target="#shopping" type="button" role="tab">Shopping</button>
            </li>
            <li class="nav-item" role="presentation">
              <button class="nav-link" data-bs-toggle="tab" data-bs-target="#result" type="button" role="tab">Result</button>
            </li>
          </ul>
          <a href="index.html" class="btn btn-green">Home</a>
        </div>
      </div>
    </div>

    <!-- Card -->
    <div class="row justify-content-center mt-3">
      <div class="col-12 col-md-8 col-lg-5">
        <div class="card calc-card">
          <div class="card-header">Fill the form below</div>

          <div class="card-body tab-content">

            <!-- General -->
            <form class="tab-pane fade show active" id="general">
              <div class="row mb-3 align-items-center">
                <label for="name" class="col-5 col-form-label">Name</label>
                <div class="col-7"><input type="text" class="form-control" id="name"></div>
              </div>
              <div class="row mb-3 align-items-center">
                <label for="age" class="col-5 col-form-label">Age</label>
                <div class="col-7"><input type="number" class="form-control" id="age" min="1"></div>
              </div>
              <div class="row mb-1 align-items-center">
                <label for="country" class="col-5 col-form-label">Country</label>
                <div class="col-7">
                  <select class="form-select text-center" id="country">
                    <option selected>Saudi Arabia</option>
                    <option>United Arab Emirates</option>
                    <option>Kuwait</option>
                    <option>Qatar</option>
                    <option>Egypt</option>
                    <option>United Kingdom</option>
                    <option>United States</option>
                    <option>Other</option>
                  </select>
                </div>
              </div>
            </form>

            <!-- Home -->
            <form class="tab-pane fade" id="home">
              <div class="row mb-3 align-items-center">
                <label for="people" class="col-5 col-form-label">People in household</label>
                <div class="col-7"><input type="number" class="form-control" id="people" min="1" value="1"></div>
              </div>
              <div class="row mb-1 align-items-center">
                <label for="ac" class="col-5 col-form-label">A/C hours per day</label>
                <div class="col-7"><input type="number" class="form-control" id="ac" min="0" max="24" value="0"></div>
              </div>
            </form>

            <!-- Travel -->
            <form class="tab-pane fade" id="travel">
              <div class="row mb-3 align-items-center">
                <label for="km" class="col-5 col-form-label">Car km per week</label>
                <div class="col-7"><input type="number" class="form-control" id="km" min="0" value="0"></div>
              </div>
              <div class="row mb-1 align-items-center">
                <label for="flights" class="col-5 col-form-label">Flights per year</label>
                <div class="col-7"><input type="number" class="form-control" id="flights" min="0" value="0"></div>
              </div>
            </form>

            <!-- Food -->
            <form class="tab-pane fade" id="food">
              <div class="row mb-1 align-items-center">
                <label for="meat" class="col-5 col-form-label">Meat meals per week</label>
                <div class="col-7"><input type="number" class="form-control" id="meat" min="0" max="21" value="0"></div>
              </div>
            </form>

            <!-- Electronic usage -->
            <form class="tab-pane fade" id="electronic">
              <div class="row mb-1 align-items-center">
                <label for="kwh" class="col-5 col-form-label">Electricity (kWh per month)</label>
                <div class="col-7"><input type="number" class="form-control" id="kwh" min="0" value="0"></div>
              </div>
            </form>

            <!-- Shopping -->
            <form class="tab-pane fade" id="shopping">
              <div class="row mb-1 align-items-center">
                <label for="items" class="col-5 col-form-label">New items bought per month</label>
                <div class="col-7"><input type="number" class="form-control" id="items" min="0" value="0"></div>
              </div>
            </form>

            <!-- Result -->
            <div class="tab-pane fade result-box" id="result">
              <p id="resultText" class="mb-0">Fill in the other tabs to see your result.</p>
            </div>

          </div>

          <div class="card-footer">
            <button type="button" class="btn btn-green me-2" id="prevBtn">Prev</button>
            <button type="button" class="btn btn-green" id="nextBtn">Next</button>
          </div>
        </div>
      </div>
    </div>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    const tabs = Array.from(document.querySelectorAll('#calcTabs .nav-link'));
    const val = id => parseFloat(document.getElementById(id).value) || 0;

    function activeIndex() {
      return tabs.findIndex(t => t.classList.contains('active'));
    }
    function go(step) {
      const i = Math.min(Math.max(activeIndex() + step, 0), tabs.length - 1);
      bootstrap.Tab.getOrCreateInstance(tabs[i]).show();
    }
    document.getElementById('prevBtn').addEventListener('click', () => go(-1));
    document.getElementById('nextBtn').addEventListener('click', () => go(1));

    // Simple yearly estimate in kg of CO2
    function calculate() {
      const people = Math.max(val('people'), 1);
      const home = (val('ac') * 1.5 * 365 * 0.6) / people;
      const travel = val('km') * 52 * 0.19 + val('flights') * 250;
      const food = val('meat') * 52 * 2.5;
      const electric = val('kwh') * 12 * 0.6;
      const shopping = val('items') * 12 * 15;
      const tonnes = (home + travel + food + electric + shopping) / 1000;
      const name = document.getElementById('name').value.trim();
      document.getElementById('resultText').innerHTML =
        (name ? name + ', your' : 'Your') + ' estimated carbon footprint is <strong>' +
        tonnes.toFixed(2) + ' tonnes of CO\u2082 per year</strong>.';
    }
    document.querySelector('[data-bs-target="#result"]').addEventListener('shown.bs.tab', calculate);
  </script>
</body>
</html>
